name: Architecture Decision
description: Record or propose an architecture decision
title: "[ADR] "
labels: [type:docs, area:architecture]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [db, rls, auth, ai, rag, privacy, security, billing, admin, infra, other]
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options: [low, medium, high, critical]
    validations:
      required: true
