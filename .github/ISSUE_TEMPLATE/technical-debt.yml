name: Technical Debt
description: Track a deliberate technical compromise
title: "[Debt] "
labels: [type:chore, area:architecture]
body:
  - type: textarea
    id: debt
    attributes:
      label: Debt
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk if not fixed
    validations:
      required: true
  - type: textarea
    id: repayment
    attributes:
      label: Repayment plan
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3, p4]
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Target date or milestone
