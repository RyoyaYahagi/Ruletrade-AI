name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test hygiene (no .skip/.only)
        run: npm run check:test-hygiene

      - name: Repo hygiene (no DB artifacts)
        run: npm run check:repo-hygiene

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
