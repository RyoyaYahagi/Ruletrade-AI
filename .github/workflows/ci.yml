name: CI

on:
  push:
    branches: ["simplify-v2"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SQLITE_DATABASE_PATH: ./data/ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
