<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Ruletrade-AI — Rule Session</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ecebe6;
        --surface: #ffffff;
        --border: #d8d5cd;
        --border-subtle: #e5e2db;
        --ink: #1a1a17;
        --ink-2: #3d3b35;
        --muted: #6b6961;
        --muted-2: #93908a;
        --faint: #b9b6ae;
        --rose-ink: #9f1239;
        --rose-50: #fff1f3;
        --rose-200: #fecdd6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          "Hiragino Kaku Gothic ProN",
          "Noto Sans JP",
          -apple-system,
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ----- Top switcher bar ----- */
      .switcher {
        flex: 0 0 auto;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 10px 18px;
        gap: 14px;
        height: 56px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand .mark {
        width: 24px;
        height: 24px;
        background: #1a1a17;
        color: #fafaf7;
        display: grid;
        place-items: center;
        border-radius: 5px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        font-size: 12px;
      }
      .brand .name {
        font-size: 14px;
        font-weight: 600;
      }
      .brand .sub {
        font-size: 12px;
        color: var(--muted);
      }

      .divider {
        width: 1px;
        height: 24px;
        background: var(--border);
      }

      .pattern-group {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .pattern-btn {
        background: transparent;
        border: none;
        padding: 8px 14px;
        font-family: inherit;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          background 120ms,
          color 120ms;
        border-right: 1px solid var(--border);
      }
      .pattern-btn:last-child {
        border-right: none;
      }
      .pattern-btn:hover {
        color: var(--ink);
        background: #f3f1ec;
      }
      .pattern-btn.active {
        background: var(--ink);
        color: #fafaf7;
      }
      .pattern-btn .num {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.06);
        color: inherit;
      }
      .pattern-btn.active .num {
        background: rgba(255, 255, 255, 0.15);
      }
      .pattern-btn .label-sub {
        font-size: 11px;
        color: var(--muted-2);
        margin-left: 2px;
      }
      .pattern-btn.active .label-sub {
        color: rgba(255, 255, 255, 0.7);
      }

      .spacer {
        flex: 1;
      }

      .meta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .meta .row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .meta .k {
        color: var(--muted-2);
      }
      .meta .v {
        color: var(--ink-2);
        font-family: "JetBrains Mono", monospace;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--rose-ink);
        background: var(--rose-50);
        border: 1px solid var(--rose-200);
      }
      .pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      /* ----- Frames ----- */
      .frames {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
        transition: opacity 200ms ease;
      }
      .frame[hidden] {
        display: none;
      }
      .frame.is-active {
        opacity: 1;
      }
      .frame.is-inactive {
        opacity: 0;
        pointer-events: none;
      }

      /* Keyboard shortcut hint */
      .kbd {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 3px;
        background: #fbfaf7;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="switcher">
      <div class="brand">
        <div class="mark">R</div>
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 1px;
            line-height: 1.2;
          "
        >
          <div class="name">Ruletrade-AI</div>
          <div class="sub">投資ルール設計ワークベンチ · デザイン比較</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="pattern-group" role="tablist" aria-label="デザインパターン">
        <button
          class="pattern-btn active"
          data-pattern="dense"
          role="tab"
          aria-selected="true"
        >
          <span class="num">1</span>
          <span>Dense</span>
          <span class="label-sub">3 カラム / 高密度</span>
        </button>
        <button
          class="pattern-btn"
          data-pattern="calm"
          role="tab"
          aria-selected="false"
        >
          <span class="num">2</span>
          <span>Calm</span>
          <span class="label-sub">2 カラム / 低密度</span>
        </button>
      </div>

      <div class="spacer"></div>

      <div class="meta">
        <span class="row"
          ><span class="k">銘柄:</span> <span class="v">6758</span></span
        >
        <span class="row"
          ><span class="k">完成度:</span> <span class="v">72 / 100</span></span
        >
        <span class="pill"><span class="dot"></span>Blocked</span>
        <span class="row" style="gap: 4px">
          <span class="k">切替:</span> <span class="kbd">1</span>
          <span class="kbd">2</span>
        </span>
      </div>
    </header>

    <main class="frames">
      <iframe
        class="frame is-active"
        id="frame-dense"
        src="Ruletrade Rule Session (Dense).html"
        title="Pattern 1 — Dense"
        loading="eager"
      ></iframe>
      <iframe
        class="frame is-inactive"
        id="frame-calm"
        src="Ruletrade Rule Session (Calm).html"
        title="Pattern 2 — Calm"
        loading="lazy"
        hidden
      ></iframe>
    </main>

    <script>
      (() => {
        const buttons = document.querySelectorAll(".pattern-btn");
        const frames = {
          dense: document.getElementById("frame-dense"),
          calm: document.getElementById("frame-calm"),
        };
        let calmLoaded = false;

        function setPattern(p) {
          if (!frames[p]) return;
          buttons.forEach((b) => {
            const active = b.dataset.pattern === p;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", active ? "true" : "false");
          });
          Object.entries(frames).forEach(([k, el]) => {
            const active = k === p;
            el.classList.toggle("is-active", active);
            el.classList.toggle("is-inactive", !active);
            if (active) {
              el.hidden = false;
              if (k === "calm" && !calmLoaded) {
                // already pointing at the right src, just promote to eager
                calmLoaded = true;
              }
            }
          });
          try {
            localStorage.setItem("rt_pattern", p);
          } catch (e) {}
          try {
            history.replaceState(null, "", "#" + p);
          } catch (e) {}
        }

        buttons.forEach((b) =>
          b.addEventListener("click", () => setPattern(b.dataset.pattern)),
        );

        // Keyboard: 1 / 2
        window.addEventListener("keydown", (e) => {
          if (e.target && /input|textarea|select/i.test(e.target.tagName))
            return;
          if (e.key === "1") setPattern("dense");
          if (e.key === "2") setPattern("calm");
        });

        // Restore last choice (hash > localStorage)
        const fromHash = (location.hash || "").replace("#", "");
        const stored = (() => {
          try {
            return localStorage.getItem("rt_pattern");
          } catch (e) {
            return null;
          }
        })();
        const initial = fromHash || stored || "dense";
        if (initial !== "dense") setPattern(initial);
      })();
    </script>
  </body>
</html>
