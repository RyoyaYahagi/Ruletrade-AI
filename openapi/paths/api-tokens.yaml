paths:
  /api/settings/api-tokens:
    get:
      tags: [Agents]
      security:
        - cookieAuth: []
      responses:
        "200": { description: Token metadata list }
    post:
      tags: [Agents]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 80 }
                scopes: { type: string, enum: [read, read,write], default: read }
                expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201": { description: Token issued; plaintext is returned once }
        "400": { $ref: "../components/responses.yaml#/ValidationError" }

  /api/mcp:
    post:
      tags: [Agents]
      security:
        - bearerAuth: []
      description: Streamable HTTP MCP endpoint. Finalize, approval, deletion, and notification response tools are not exposed.
      responses:
        "200": { description: MCP response }
        "401": { $ref: "../components/responses.yaml#/Unauthorized" }
        "403": { $ref: "../components/responses.yaml#/Forbidden" }
